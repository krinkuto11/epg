name: build
# Every hour: rebuild the guide and publish it on the dist branch when it
# changed. dobleM publishes about 08:53, 12:53, 16:53 and 20:53 (Madrid);
# Movistar's live flags can change any time, so the guide is rebuilt hourly.
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the guide
        run: go run ./cmd/epg -out dist
      - name: Publish to the dist branch
        run: |
          new=$(sha256sum dist/guiatv.xml | cut -d' ' -f1)
          old=""
          if git fetch -q --depth 1 origin dist 2>/dev/null; then
            old=$(git show FETCH_HEAD:guiatv.xml | sha256sum | cut -d' ' -f1)
          fi
          if [ "$new" = "$old" ]; then
            echo "Guide unchanged: nothing to publish."
            exit 0
          fi
          cd dist
          git init -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guiatv.xml guiatv.xml.gz status.json
          git commit -q -m "Guide $(date -u +%Y-%m-%dT%H:%MZ)"
          # One commit, replaced each time: the history would grow by 34 MB an hour.
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dist
          echo "Published."
