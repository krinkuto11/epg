name: cleanup-artifacts

on:
  schedule:
    # Run daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["build", "ci"]
    types: [completed]

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean obsolete artifacts keeping only latest run
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            console.log(`Checking workflows and artifacts for ${owner}/${repo}...`);

            // 1. Fetch active workflows
            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              { owner, repo }
            );

            // 2. Identify the latest run ID for each active workflow
            const keepRunIds = new Set();
            for (const wf of workflows) {
              if (wf.state !== 'active') continue;
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: wf.id,
                  per_page: 5,
                });
                for (const r of (runs.data.workflow_runs || [])) {
                  if (r.status === 'in_progress') {
                    keepRunIds.add(r.id);
                  } else if (r.status === 'completed') {
                    keepRunIds.add(r.id);
                    console.log(`Keeping latest completed run for "${wf.name}": ID ${r.id} (#${r.run_number})`);
                    break;
                  }
                }
              } catch (err) {
                console.warn(`Could not fetch runs for "${wf.name}": ${err.message}`);
              }
            }

            console.log(`Protected run IDs: ${Array.from(keepRunIds).join(', ')}`);

            // 3. Paginate all artifacts
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            console.log(`Total artifacts found: ${artifacts.length}`);
            if (artifacts.length === 0) {
              console.log('No artifacts found. Nothing to clean.');
              return;
            }

            // 4. Delete artifacts not belonging to protected runs
            let deleted = 0;
            let kept = 0;

            for (const artifact of artifacts) {
              const runId = artifact.workflow_run ? artifact.workflow_run.id : null;
              if (runId && keepRunIds.has(runId)) {
                kept++;
                console.log(`Keeping artifact "${artifact.name}" (ID ${artifact.id}) from run ${runId}`);
              } else {
                try {
                  console.log(`Deleting obsolete artifact "${artifact.name}" (ID ${artifact.id}) from run ${runId}...`);
                  await github.rest.actions.deleteArtifact({
                    owner,
                    repo,
                    artifact_id: artifact.id,
                  });
                  deleted++;
                } catch (err) {
                  console.error(`Failed to delete artifact ${artifact.id}: ${err.message}`);
                }
              }
            }

            console.log(`Cleanup complete! Kept: ${kept}, Deleted: ${deleted}`);
